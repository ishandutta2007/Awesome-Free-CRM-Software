<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090D16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#080C14"/></linearGradient><linearGradient id="primaryAccent" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".85"/><stop offset="100%" stop-color="#0F172A" stop-opacity=".75"/></linearGradient><linearGradient id="pipelineLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".2"/><stop offset="50%" stop-color="#818CF8" stop-opacity=".8"/><stop offset="100%" stop-color="#34D399" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-glow{0%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes float-badge{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-badge-rev{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes blink-dot{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}.nebula-1{animation:pulse-glow 8s ease-in-out infinite alternate;transform-origin:200px 100px}.nebula-2{animation:pulse-glow 7s ease-in-out infinite alternate-reverse;transform-origin:700px 220px}.flow-path{stroke-dasharray:8 6;animation:flow-dash 3s linear infinite}.badge-float-1{animation:float-badge 5s ease-in-out infinite}.badge-float-2{animation:float-badge-rev 6s ease-in-out infinite}.status-dot{animation:blink-dot 2s ease-in-out infinite}.main-title,.sub-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-size:42px;font-weight:800;letter-spacing:-.8px}.sub-title{font-size:17px;font-weight:500;fill:#94a3b8;letter-spacing:.2px}.card-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-size:12px;font-weight:600}</style><rect width="900" height="320" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" rx="16"/><g opacity=".45"><circle cx="200" cy="90" r="130" fill="#38BDF8" class="nebula-1" filter="url(#glow)" opacity=".3"/><circle cx="720" cy="200" r="140" fill="#818CF8" class="nebula-2" filter="url(#glow)" opacity=".3"/><circle cx="820" cy="60" r="90" fill="#C084FC" filter="url(#glow)" opacity=".2"/></g><g opacity=".5"><path fill="none" stroke="url(#pipelineLine)" stroke-width="2.5" d="M 60 270 Q 250 240 450 265 T 840 250" class="flow-path"/><path fill="none" stroke="url(#pipelineLine)" stroke-dasharray="4 8" stroke-width="1.5" d="M 100 285 Q 320 265 550 280 T 820 275" class="flow-path"/></g><g class="badge-float-1" transform="translate(60, 32)"><rect width="135" height="32" fill="#1E293B" stroke="#38BDF8" stroke-width="1" opacity=".9" rx="16"/><circle cx="18" cy="16" r="4.5" fill="#38BDF8" class="status-dot"/><text x="32" y="20.5" fill="#E2E8F0" class="card-text">✨ Open Source</text></g><g class="badge-float-2" transform="translate(710, 32)"><rect width="130" height="32" fill="#1E293B" stroke="#34D399" stroke-width="1" opacity=".9" rx="16"/><circle cx="18" cy="16" r="4.5" fill="#34D399" class="status-dot"/><text x="32" y="20.5" fill="#E2E8F0" class="card-text">⚡ 100% Free Tiers</text></g><g text-anchor="middle" transform="translate(450, 125)"><text y="0" fill="#FFF" class="main-title">Awesome Free CRM Software</text><rect width="280" height="3.5" x="-140" y="14" fill="url(#primaryAccent)" rx="2"/><text y="44" class="sub-title">Curated Free SaaS Platforms &amp; Self-Hosted Open-Source Customer Management Systems</text></g><g><g transform="translate(100, 215) translate(0, 0)"><rect width="150" height="58" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" rx="10"/><circle cx="20" cy="20" r="4" fill="#38BDF8"/><text x="32" y="24" fill="#F8FAFC" class="card-text">Lead Captured</text><text x="20" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">HubSpot &amp; Zoho Free</text></g><path stroke="#475569" stroke-linecap="round" stroke-width="2" d="M 158 29 L 174 29" transform="translate(100, 215)"/><g transform="translate(100, 215) translate(182, 0)"><rect width="150" height="58" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" rx="10"/><circle cx="20" cy="20" r="4" fill="#818CF8"/><text x="32" y="24" fill="#F8FAFC" class="card-text">Pipeline Tracking</text><text x="20" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Twenty &amp; EspoCRM</text></g><path stroke="#475569" stroke-linecap="round" stroke-width="2" d="M 340 29 L 356 29" transform="translate(100, 215)"/><g transform="translate(100, 215) translate(364, 0)"><rect width="150" height="58" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" rx="10"/><circle cx="20" cy="20" r="4" fill="#C084FC"/><text x="32" y="24" fill="#F8FAFC" class="card-text">Omnichannel Ops</text><text x="20" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">SuiteCRM &amp; Dolibarr</text></g><path stroke="#475569" stroke-linecap="round" stroke-width="2" d="M 522 29 L 538 29" transform="translate(100, 215)"/><g transform="translate(100, 215) translate(546, 0)"><rect width="154" height="58" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2" rx="10"/><circle cx="20" cy="20" r="4" fill="#10B981"/><text x="32" y="24" fill="#34D399" class="card-text">Closed &amp; Retained</text><text x="20" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Self-Hosted / Cloud</text></g></g></svg>